[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/apply"
  to = "/#apply"
  status = 302

[template]
  [template.environment]
    BREVO_API_KEY = "Brevo API key with contact and transactional-email permission"
    BREVO_LIST_ID = "Numeric Brevo list ID for Signature Weekend invitations"
    BREVO_DOI_TEMPLATE_ID = "Numeric Brevo double-opt-in template ID"
    SITE_URL = "Final public site URL, without trailing slash"
    ALLOWED_ORIGINS = "Final public site URL, without trailing slash"
    TEAM_EMAIL = "Optional: team inbox for new request notifications"
    BREVO_SENDER_EMAIL = "Optional: verified Brevo sender email"
